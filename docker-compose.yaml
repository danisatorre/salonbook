services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb_salonbook
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongodb_salonbook:/data/db

volumes:
  mongodb_salonbook: